kind = "web"
previewPath = "/"
title = "Delegate"
description = "Delegate is a WhatsApp and Instagram inbox for managing customer conversations, approved business facts, response controls, and shareable media with Del, the business AI assistant."
version = "1.0.0"
id = "artifacts/whatsapp-business"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21384

[services.development]
run = "pnpm --filter @workspace/whatsapp-business run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/whatsapp-business", "run", "build" ]
serve = "static"
publicDir = "artifacts/whatsapp-business/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21384"
BASE_PATH = "/"
