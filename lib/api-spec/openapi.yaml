openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: business
    description: WhatsApp business administration
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /facts:
    post:
      operationId: saveBusinessFact
      tags: [business]
      summary: Save a business fact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessFactInput"
      responses:
        "200":
          description: Fact accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessStatus"
        "400":
          description: Invalid fact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SuccessStatus:
      type: object
      properties:
        ok:
          type: boolean
      required: [ok]
    ErrorStatus:
      type: object
      properties:
        error:
          type: string
      required: [error]
    BusinessFactInput:
      type: object
      properties:
        key:
          type: string
          minLength: 1
        value:
          type: string
          minLength: 1
      required: [key, value]

